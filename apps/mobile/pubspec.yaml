name: nimmy
description: "Nimmy — Voice-first Personal AI OS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  shimmer: ^3.0.0

  # State management
  provider: ^6.1.4
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  http: ^1.4.0
  dio: ^5.8.0

  # Date/Time
  intl: ^0.20.2
  table_calendar: ^3.2.0

  # Icons
  flutter_svg: ^2.0.17
  iconsax_flutter: ^1.0.0
  supabase: ^2.16.1
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
