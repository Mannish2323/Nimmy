[package]
name = "nimmy-performance"
version = "0.1.0"
edition = "2024"
description = "High-performance modules for Nimmy — audio processing, encryption, search"

[lib]
name = "nimmy_performance"
crate-type = ["cdylib", "staticlib"]  # For FFI with Flutter

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
