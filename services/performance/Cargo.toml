[package]
name = "nimmy-performance"
version = "0.1.0"
edition = "2021"
description = "High-performance native engine for Nimmy — DSP audio processing, vector similarity, and FFI"

[lib]
name = "nimmy_performance"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
